/* PUENTE-LECCION v1 */
(() => {
  if (window.parent === window) return;
  let anfitrion = false;
  const estilo = document.createElement('style');
  estilo.textContent = 'html[data-leccion="anfitrion"] #frase{display:none}';
  document.head.appendChild(estilo);
  function texto(s) {
    const nodo = document.createElement('span');
    nodo.innerHTML = String(s || '').replace(/\[\[[^|\]]+\|([^\]]+)\]\]/g, '$1').replace(/\{[\d,]+\}/g, '');
    return nodo.textContent;
  }
  const enviar = (tipo, datos) => window.parent.postMessage({ tipo, v: 1, ...datos }, location.origin);
  const estaciones = ESTACIONES.map(E => ({ t: E.t, pags: [{ s: [E.s], nota: E.a, palabras: E.g.map(k => ({ palabra: k, definicion: GLOS[k] })) }] }));
  const estado = () => ({ e: current, p: 0 });
  function ir(paso) { window.__leche.fijar(estP(clamp(current + paso, 0, estaciones.length - 1))); }
  const pintar = setStation;
  setStation = function (...args) { const antes = current; const resultado = pintar.apply(this, args); if (current !== antes) pagina(); return resultado; };
  const callar = stopVoice;
  const abrir = que => { if (['palabras', 'fuentes', 'repaso'].includes(que)) $(que).click(); };
  document.addEventListener('click', e => {
    if (anfitrion && e.target.closest?.('#escuchar')) { e.stopImmediatePropagation(); callar(); }
  }, true);
  function pagina() {
    if (!anfitrion) return;
    const pos = estado(); if (!pos || pos.e < 0) return;
    const E = estaciones[pos.e], P = E.pags[pos.p];
    const caja = document.getElementById('medidor')?.getBoundingClientRect();
    enviar('chagra:leccion-pagina', {
      estacion: pos.e + 1, total: estaciones.length,
      titulo: E.t, pagina: pos.p + 1, paginas: E.pags.length,
      clase: P.k || 'dice', frases: P.s.map(texto), nota: texto(P.nota),
      palabras: P.palabras.map(({ palabra, definicion }) => ({ palabra: texto(palabra), definicion: texto(definicion) })),
      anclas: { medidor: caja ? { x: caja.x, y: caja.y, w: caja.width, h: caja.height } : null }
    });
  }
  window.addEventListener('message', e => {
    if (e.origin !== location.origin || e.source !== window.parent || !e.data || e.data.v !== 1) return;
    const m = e.data;
    if (m.tipo === 'chagra:leccion-hola') {
      anfitrion = true;
      callar();
      document.documentElement.dataset.leccion = 'anfitrion';
      enviar('chagra:leccion-lista', {
        slug: location.pathname.match(/descenso-([^/]+)/)?.[1] || location.pathname.split('/').filter(Boolean).slice(-2, -1)[0] || '',
        titulo: document.title, estaciones: estaciones.map(e => ({ t: e.t, paginas: e.pags.length }))
      });
      pagina();
    } else if (anfitrion && m.tipo === 'chagra:leccion-ir' && (m.paso === -1 || m.paso === 1)) {
      ir(m.paso);
    } else if (anfitrion && m.tipo === 'chagra:leccion-abrir') {
      abrir(m.que);
    }
  });
})();
/* fin PUENTE-LECCION */
})();
