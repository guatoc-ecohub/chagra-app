    <!-- Content-Security-Policy (Task 112, corregido tras incidente prod #1631).
         CRITICO: script-src DEBE incluir 'wasm-unsafe-eval'; sin eso el navegador
         bloquea WebAssembly -> sqlite-wasm (capa de datos) no carga -> app muerta
         (Failed to fetch, todo en 0). worker-src para el service worker de la PWA.
         Regresion cubierta por el smoke en tests/offline.spec.js (WebAssembly.compile).
         CRITICO 2: script-src DEBE incluir blob:; el <Text> 3D de drei
         (troika-three-text: letreros del hato en corral/mercado) levanta su
         typesetter en un worker blob que hace importScripts(blob:) — el worker
         hereda esta CSP y sin blob: el rehydrate falla ("Worker module function
         was called but `init` did not return a callable function"), el <Text>
         suspende dentro del Canvas y el diorama ENTERO queda invisible (cielo
         solo, sin error visible). Detectado en gate visual del mundo mercado
         2026-07-30.
         static.cloudflareinsights.com en script-src (bug consola prod
         STEV-03/C12, 2026-10-31): Cloudflare inyecta el beacon de Web
         Analytics en el borde de la zona; esta CSP lo bloqueaba. Mantener
         en sync con scripts/http-security.mjs (buildContentSecurityPolicy) —
         esta <meta> y el header aplican ambas, no se reemplazan entre sí.
         El build falla si esta lista difiere de la del script; sin la fuente
         https: suelta, todo origen externo nuevo se agrega en los dos sitios.
         frame-ancestors va solo en el header: en <meta> no tiene efecto. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      frame-src 'self' https://3d.guatoc.co;
      script-src 'self' 'wasm-unsafe-eval' blob: https://static.cloudflareinsights.com;
      style-src 'self' 'unsafe-inline';

    <!-- iOS PWA install — Safari iOS NO usa manifest.json para "Añadir a
         pantalla de inicio". Requiere meta tags Apple-specific + un
         apple-touch-icon PNG (NO SVG) de 180×180 mínimo. Sin esto,
         "Añadir a pantalla de inicio" instala un shortcut que abre en
         Safari (no standalone) y sin ícono real. Detectado en field
         test 2026-04-30 con la diseñadora. -->
    <!-- Fuentes self-host del home "Finca Viva" (mockup F2): Baloo 2 (display) +
         Nunito (cuerpo). Self-host porque la CSP sólo permite font-src 'self'
         (offline-first, sin Google Fonts por red). El @font-face vive en
         finca-viva-hero.css y carga al usar esa portada, sin competir con login. -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chagra" />

    <title>Chagra</title>


    <!-- Pre-React loader inline (issue #121): evita flash blanco al
         arrancar PWA fría antes de que React + Suspense pinten el
         ChagraGrowLoader. Sale del DOM cuando React monta el root. -->
    <style>
      html, body { background: #020617; margin: 0; }
      #pre-loader {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #020617;
        color: #34d399;
        font-family: system-ui, -apple-system, sans-serif;
        z-index: 9999;
        transition: opacity 200ms ease-out;
      }
      #pre-loader .pl-emoji {
        font-size: 48px; line-height: 1;
        animation: pl-grow 1.6s ease-in-out infinite;
      }
      #pre-loader .pl-text {
        margin-top: 14px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #6ee7b7;
        opacity: 0.85;
      }
      @keyframes pl-grow {
        0%, 100% { transform: scale(0.85); opacity: 0.7; }
        50%      { transform: scale(1.05); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #pre-loader .pl-emoji { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="pre-loader" aria-label="Cargando Chagra">
      <span class="pl-emoji" aria-hidden="true">🌱</span>
      <span class="pl-text">Preparando su chagra</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="/boot-loader.js"></script>
